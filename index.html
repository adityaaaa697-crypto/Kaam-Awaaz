<title>Kaam Awaaz</title>

<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#22190f;--mut:#7d6b58;--brand:#f76707;--brand2:#e03e00;--navy:#1d2b4f;--ok:#12a05c;--no:#d6336c;--line:#f3e4d0;--sh:0 8px 24px rgba(140,70,0,.10);--sh2:0 3px 10px rgba(140,70,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans Devanagari",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:17px;
 background:radial-gradient(circle at 0 0,#ffe3c2 0,transparent 38%),radial-gradient(circle at 100% 20%,#ffe9d6 0,transparent 35%),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,.big,.sm,.role b,.hero h2,.wb,.amt,.stats b,.pn{font-family:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,#ff8a1f,#e03e00);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(224,62,0,.35);border-radius:0 0 22px 22px}
header h1{font-size:17px;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.22);border:0;color:#fff;font-size:15px;padding:8px 13px;border-radius:12px;backdrop-filter:blur(4px)}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
main.fx>*{animation:up .35s ease}
main.fx>*:nth-child(2){animation-delay:.04s}main.fx>*:nth-child(3){animation-delay:.08s}main.fx>*:nth-child(4){animation-delay:.12s}main.fx>*:nth-child(5){animation-delay:.16s}
@keyframes up{from{transform:translateY(10px)}to{transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0;box-shadow:var(--sh2)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;font-size:21px;font-weight:700;border:0;border-radius:18px;background:linear-gradient(135deg,#ff8a1f,#e8590c);color:#fff;margin:10px 0;box-shadow:0 8px 18px rgba(232,89,12,.30);transition:transform .12s,box-shadow .12s}
.big:active,.sm:active,.tile:active,.chip:active,.role:active{transform:scale(.96)}
.big.ok{background:linear-gradient(135deg,#27c27a,#0c8f55);box-shadow:0 8px 18px rgba(18,160,92,.30)}
.big.no{background:linear-gradient(135deg,#f06595,#c2255c);box-shadow:0 8px 18px rgba(214,51,108,.28)}
.big.gray{background:linear-gradient(135deg,#8d7b68,#6c5b49);box-shadow:none}
.big.line{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:var(--sh2)}
.big:disabled{opacity:.55;box-shadow:none}
.mic{position:relative;width:118px;height:118px;border-radius:50%;font-size:50px;border:0;background:linear-gradient(135deg,#ff8a1f,#e03e00);color:#fff;display:block;margin:16px auto;box-shadow:0 10px 26px rgba(232,89,12,.45)}
.mic::before,.mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(247,103,7,.35);animation:ring 2.4s ease-out infinite}
.mic::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.35);opacity:0}}
.mic.on{background:linear-gradient(135deg,#f06595,#c2255c);animation:p 1s infinite}
.mic.on::before,.mic.on::after{border-color:rgba(214,51,108,.45)}
@keyframes p{50%{transform:scale(1.07)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 2px;text-align:center;font-size:14.5px;line-height:1.25;box-shadow:var(--sh2);transition:all .15s}
.tile b{display:block;font-size:32px}
.tile.sel{border-color:var(--brand);background:linear-gradient(180deg,#fff4e6,#ffe8cc);box-shadow:0 6px 16px rgba(247,103,7,.22);transform:translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:15.5px;transition:all .15s}
.chip.sel{border-color:var(--brand);background:linear-gradient(135deg,#ff8a1f,#e8590c);color:#fff;font-weight:600}
h2{font-size:21px;margin:18px 0 6px;font-weight:800}
.mut{color:var(--mut);font-size:14.5px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#f1ece4;white-space:nowrap;font-weight:600}
.badge.g{background:#d3f9e4;color:#0b6b3a}.badge.y{background:#fff0bf;color:#7a5200}.badge.r{background:#ffdfe9;color:#a3194a}
input[type=text],input[type=number]{width:100%;padding:13px 14px;font-size:18px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:0;transition:border .15s,box-shadow .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(247,103,7,.15)}
.stepper button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:24px;box-shadow:var(--sh2)}
.sm{padding:10px 15px;border:0;border-radius:13px;font-size:16px;background:linear-gradient(135deg,#ff8a1f,#e8590c);color:#fff;font-weight:700;transition:transform .12s}
.sm.ok{background:linear-gradient(135deg,#27c27a,#0c8f55)}.sm.no{background:linear-gradient(135deg,#f06595,#c2255c)}
.sm.line{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:600}
.sm.glass{background:rgba(255,255,255,.22);color:#fff;border:0}
.stars button{font-size:32px;background:none;border:0;padding:2px;color:#f59f00}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:18px}
.miss{outline:3px dashed #ffa94d;outline-offset:2px}
.wallet{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1d2b4f,#33498a);color:#fff;border-radius:20px;padding:14px 16px;margin:0 0 12px;box-shadow:0 10px 24px rgba(29,43,79,.35);position:relative;overflow:hidden}
.wallet::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.wl{font-size:13px;opacity:.8}.wb{font-size:30px;font-weight:800;line-height:1.1}
.money{background:linear-gradient(135deg,#f4fbf7,#eaf7f0);border:1px solid #cfeedd;border-radius:14px;padding:10px 12px;font-size:15px;margin-top:10px}
.money div{display:flex;justify-content:space-between;align-items:center}
.money b{font-family:"Baloo 2",sans-serif;font-size:19px;color:#0b6b3a}
.pay{display:inline-block;margin-top:6px;font-size:13.5px;padding:4px 11px;border-radius:999px;background:#e3efff;color:#0b4a7a;font-weight:600}
.pay.g{background:#d3f9e4;color:#0b6b3a}.pay.r{background:#fff0bf;color:#7a5200}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:180px}
.msg{max-width:85%;padding:10px 13px;border-radius:18px 18px 18px 4px;background:#fff;border:1px solid var(--line);font-size:16.5px;box-shadow:var(--sh2)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#fff0dc,#ffe2bd);border-color:#ffd8a8;border-radius:18px 18px 4px 18px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#fff1de,#ffe0b8);font-size:26px;flex:none}
.avatar.big{width:58px;height:58px;font-size:32px;background:rgba(255,255,255,.25);border-radius:18px}
/* home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1d2b4f 0%,#33498a 55%,#f76707 140%);color:#fff;border-radius:26px;padding:22px 18px;margin:0 0 14px;box-shadow:0 14px 30px rgba(29,43,79,.35)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:8px 0 4px;font-size:27px;line-height:1.2}
.hero p{margin:0;opacity:.88;font-size:15px}
.emojis{display:flex;gap:8px;font-size:28px}.emojis span{animation:bob 2.6s ease-in-out infinite}
.emojis span:nth-child(2){animation-delay:.2s}.emojis span:nth-child(3){animation-delay:.4s}.emojis span:nth-child(4){animation-delay:.6s}.emojis span:nth-child(5){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-6px)}}
.roles{display:grid;gap:12px}
.role{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:22px;padding:16px;color:#fff;transition:transform .12s;width:100%}
.role .ri{font-size:38px;background:rgba(255,255,255,.22);border-radius:18px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex:none}
.role b{display:block;font-size:22px;line-height:1.15}.role small{display:block;opacity:.9;font-size:14px;margin-top:2px}
.role.r1{background:linear-gradient(135deg,#ff8a1f,#e03e00);box-shadow:0 12px 24px rgba(232,89,12,.35)}
.role.r2{background:linear-gradient(135deg,#27c27a,#0b8a50);box-shadow:0 12px 24px rgba(18,160,92,.30)}
.trust{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.trust span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;box-shadow:var(--sh2);font-weight:600}
.link{display:block;margin:8px auto 0;background:none;border:0;color:var(--mut);font-size:15px;text-decoration:underline}
/* worker profile */
.prof{background:linear-gradient(135deg,#ff8a1f,#d9480f);color:#fff;border-radius:24px;padding:16px;margin:0 0 12px;box-shadow:0 12px 26px rgba(217,72,15,.35)}
.pn{font-size:24px;font-weight:800;line-height:1.1;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.2);border-radius:14px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:19px;line-height:1.15}.stats span{display:block;font-size:11.5px;opacity:.92}
.prof .pr{margin-top:10px;font-size:14px;opacity:.95}
/* job cards */
.job{border-left:6px solid var(--line)}
.job.st-sent{border-left-color:#fab005}.job.st-accepted{border-left-color:#228be6}.job.st-done{border-left-color:#12a05c}
.job.st-cancelled,.job.st-noshow,.job.st-withdrawn,.job.st-declined{border-left-color:#d6336c}.job.st-disputed{border-left-color:#fab005}
.celebrate{position:relative;text-align:center;padding:30px 15px}
.celebrate .pop{font-size:60px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.confetti{position:absolute;left:0;right:0;top:0;height:100%;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall 2.2s ease-in both}
@keyframes fall{to{transform:translateY(260px) rotate(300deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=S.lang==='hi'?'hi-IN':'en-IN';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(u.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function listen(cb){
  if(!SR){alert(t('micFail'));return}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const r=new SR();r.lang=S.lang==='hi'?'hi-IN':'en-IN';r.interimResults=false;r.maxAlternatives=1;
  S.listening=true;render();
  r.onresult=e=>cb(e.results[0][0].transcript);
  r.onerror=()=>{S.listening=false;render();speak(t('noSpeech'))};
  r.onend=()=>{if(S.listening){S.listening=false;render()}};
  r.start();
}

/* ---------- parsing a spoken request ---------- */
function parseSpeech(raw){
  let s=' '+raw.toLowerCase().replace(/[,।.?!"]/g,' ')+' ';
  const out={};
  const best=(list,get)=>{let b=null,n=0;for(const x of list)for(const k of get(x))if(s.includes(k)&&k.length>n){b=x.id;n=k.length}return b};
  out.trade=best(TRADES,x=>x.kw);
  out.chowk=best(S.data.chowks,c=>CK_KW[c.id]);
  let m=s.match(/(\d+|\S+)\s*(सौ|sau|hundred)/);
  if(m){const n=/^\d+$/.test(m[1])?+m[1]:NUM[m[1]];if(n){out.pay=n*100;s=s.replace(m[0],' ')}}
  if(!out.pay){m=s.match(/\b(\d{3,5})\b/);if(m){out.pay=+m[1];s=s.replace(m[0],' ')}}
  for(const tok of s.split(/\s+/)){if(/^\d{1,2}$/.test(tok)&&+tok>0){out.count=+tok;break}if(NUM[tok]){out.count=NUM[tok];break}}
  if(/परसों|parson|day after/.test(s))out.date=2;else if(/आज|aaj|today/.test(s))out.date=0;else if(/कल|kal|tomorrow/.test(s))out.date=1;
  return out;
}
function dateStr(off){const d=new Date();d.setDate(d.getDate()+off);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function dateLabel(iso){const a=new Date(iso+'T00:00'),n=new Date(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((a-b)/864e5);
  return diff===0?t('today'):diff===1?t('tomorrow'):diff===2?t('dayafter'):iso}
function summary(d){return `${d.count} ${tn(d.trade)}, ${ckn(d.chowk)}, ${[t('today'),t('tomorrow'),t('dayafter')][d.date]}, ₹${d.pay||trade(d.trade).pay}`}
function reqLine(r){const get=r.pay-wFee(r.pay);return S.lang==='hi'
  ?`${ckn(r.chowk)} में ${dateLabel(r.date)} ${r.count} ${tn(r.trade)} चाहिए। आपको ${get} रुपये मिलेंगे। हाँ या ना बोलें।`
  :`${r.count} ${tn(r.trade)} needed in ${ckn(r.chowk)}, ${dateLabel(r.date)}. You will get ${get} rupees. Say yes or no.`}

/* ---------- api ---------- */
async function api(path,body){
  const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok){alert(j.error||'error');throw new Error(j.error)}return j;
}
async function refresh(){S.data=await api('state');render()}

function luhn(n){let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return n.length>=12&&s%10===0}
function brand(n){return /^4/.test(n)?'Visa':/^(5[1-5]|2[2-7])/.test(n)?'Mastercard':/^(60|65|81|82|508)/.test(n)?'RuPay':/^3[47]/.test(n)?'Amex':'Card'}

  return `<div class="card" style="text-align:center;padding:30px"><div style="font-size:56px">❌</div><h2>${t('failed')}</h2><p>${p.err}</p></div><button class="big" data-act="payAgain">${t('tryAgain')}</button><button class="big line" data-act="payBack">${t('back')}</button>`;

async function runPay(){
  const p=S.pay;p.step='processing';render();await sleep(1500);
  const num=p.card.no.replace(/\s/g,'');
  if(p.method==='card'&&num==='4000000000000002'){p.step='fail';p.err=t('declinedCard');p.card={no:'',exp:'',cvv:''};render();return}
  const detail=p.method==='card'?`${brand(num)} •••• ${num.slice(-4)}`:p.method==='upi'?p.upi:'';
  p.card={no:'',exp:'',cvv:''};  // card data never leaves the page and is cleared right away
  try{const r=await api('wallet',{employerId:eid,amount:p.amount,method:p.method,detail});p.txn=r.txn;p.step='done';await refresh()}
  catch(e){p.step='fail';p.err=String(e.message||e);render()}
}

function vLedger(){

  const held=sum(a=>['held'].includes(a.payment)||a.status==='disputed'?a.escrow.wage+a.escrow.empFee:0);
  const rel=all.filter(x=>x.a.payment==='released');
  const revenue=rel.reduce((s,x)=>s+x.a.escrow.empFee+x.a.escrow.workerFee,0);
  const paid=rel.reduce((s,x)=>s+x.a.payout,0);

  return `<h2>${t('totals')}</h2>

function render(){
  if(!S.data)return;
  document.querySelector('[data-act=lang]').textContent=t('lang');
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(typing&&S.auto)return;
  const V={home:vHome,emp:vEmp,req:vReq,wkLogin:vWkLogin,wk:vWk,ledger:vLedger,chat:vChat,pay:vPay};
  const changed=S._v!==S.view;S._v=S.view;const y=scrollY;$app.innerHTML=(V[S.view]||vHome)();scrollTo(0,changed?0:y);
  if(changed){$app.classList.remove('fx');void $app.offsetWidth;$app.classList.add('fx')}
}

function applyParsed(p,heard){
  const d=S.draft;d.heard=heard;
  if(p.trade)d.trade=p.trade;if(p.chowk)d.chowk=p.chowk;if(p.pay)d.pay=p.pay;if(p.count)d.count=p.count;if(p.date!==undefined)d.date=p.date;
  S.listening=false;render();
  if(d.trade&&d.chowk)speak((S.lang==='hi'?'सही है? ':'Is this right? ')+summary(d));else speak(t('fillMore'));
}
async function sendMsg(text,voice){

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,rid=el.dataset.rid,w=el.dataset.w;
  S.auto=false;
  switch(a){
   case 'home':S.view='home';render();break;
   case 'lang':S.lang=S.lang==='hi'?'en':'hi';try{localStorage.lang=S.lang}catch(e){}document.documentElement.lang=S.lang;render();break;
   case 'go':S.view=el.dataset.v;if(S.view==='emp')S.draft={trade:null,chowk:null,count:1,pay:null,date:1,heard:''};await refresh();break;
   case 'topup':S.back=S.view;S.pay=newPay();S.view='pay';await refresh();break;
   case 'payAmt':S.pay.amount=+el.dataset.a;render();break;
   case 'payMethod':{const m=el.dataset.m;S.pay.method=m;S.pay.err='';S.pay.step=m==='card'?'card':m==='upi'?'upiid':'approve';render();break}
   case 'payUpiGo':{const v=document.getElementById('upiid').value.trim();if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v)){S.pay.err=t('badUpi');render();break}S.pay.upi=v;S.pay.err='';S.pay.step='approve';render();break}
   case 'payCardGo':{const c=S.pay.card,n=c.no.replace(/\s/g,''),m=c.exp.match(/^(\d\d)\/(\d\d)$/);
     const exp=m&&+m[1]>=1&&+m[1]<=12&&(2000+ +m[2])*12+ +m[1]>=new Date().getFullYear()*12+new Date().getMonth()+1;
     if(!luhn(n)||!exp||!/^\d{3,4}$/.test(c.cvv)){S.pay.err=t('badCard');render();break}
     S.pay.err='';await runPay();break}
   case 'payApprove':await runPay();break;
   case 'payDecline':S.pay.step='fail';S.pay.err=t('declinedUpi');render();break;
   case 'payAgain':S.pay=newPay();render();break;
   case 'payBack':if(S.pay&&S.pay.step!=='pick'&&S.pay.step!=='fail'){S.pay.step='pick';S.pay.err='';render()}else{S.view=S.back;S.pay=null;await refresh()}break;
   case 'payDone':S.view=S.back;S.pay=null;await refresh();break;
   case 'setUpi':{const v=prompt(t('enterPayout'),'');if(v){await api('payout',{workerId:S.wid,upi:v.trim()});await refresh()}break}
   case 'micEmp':listen(txt=>applyParsed(parseSpeech(txt),txt));break;
   case 'parseTyped':{const v=document.getElementById('typed').value;applyParsed(parseSpeech(v),v);break}
   case 'pickTrade':S.draft.trade=id;S.draft.pay=null;render();break;
   case 'pickChowk':S.draft.chowk=id;render();break;
   case 'pickDate':S.draft.date=+el.dataset.d;render();break;
   case 'cnt':S.draft.count=Math.max(1,Math.min(20,S.draft.count+ +el.dataset.d));render();break;
   case 'sendReq':{const d=S.draft;const pay=+document.getElementById('pay').value||trade(d.trade).pay;
     const r=await api('requests',{employerId:eid,trade:d.trade,chowk:d.chowk,count:d.count,pay,date:dateStr(d.date),heard:d.heard});
     S.rid=r.requestId;S.view='req';await refresh();speak(t('callSim'));break}
   case 'nextwave':await api(`requests/${rid}/nextwave`,{});await refresh();break;
   case 'arrived':await api(`requests/${rid}/arrived`,{workerId:w});await refresh();break;
   case 'cancel':if(confirm(el.dataset.late==='true'?t('confCancel'):t('confCancelEarly'))){await api(`requests/${rid}/cancel`,{workerId:w});await refresh()}break;
   case 'noshow':if(confirm(t('confNoShow'))){await api(`requests/${rid}/noshow`,{workerId:w});await refresh()}break;
   case 'dispute':await api(`requests/${rid}/dispute`,{workerId:w});await refresh();break;
   case 'resolve':await api(`requests/${rid}/resolve`,{workerId:w,outcome:el.dataset.o});await refresh();break;

   case 'wkLogout':S.wid=null;try{localStorage.removeItem('wid')}catch(e){}S.lg=newLg();S.view='wkLogin';render();break;
   case 'lgSend':{const v=document.getElementById('lphone').value.replace(/\D/g,'');S.lg.phone=v;if(!/^[6-9]\d{9}$/.test(v)){S.lg.err=t('badPhone')}else{S.lg.err='';S.lg.step='otp'}render();break}

       if(r.workerId){S.wid=r.workerId;try{localStorage.wid=S.wid}catch(e){}S.view='wk';await refresh()}else{g.step='register';g.err='';render()}}catch(e){g.err=String(e.message||e);render()}break}

   case 'regTrade':S.lg.trade=id;render();break;case 'regChowk':S.lg.chowk=id;render();break;
   case 'join':{const g=S.lg;if(!g.name.trim()||!g.trade||!g.chowk){g.err=t('regMissing');render();break}try{const r=await api('workers',{name:g.name,phone:g.phone,upi:g.upi,trade:g.trade,chowk:g.chowk});
       S.wid=r.workerId;try{localStorage.wid=S.wid}catch(e){}S.view='wk';await refresh()}catch(e){g.err=String(e.message||e);render()}break}
   case 'say':speak(reqLine(S.data.requests.find(x=>x.id===rid)));break;
   case 'sayText':speak(el.dataset.text);break;
   case 'accept':await api(`requests/${rid}/accept`,{workerId:S.wid});await refresh();break;
   case 'decline':await api(`requests/${rid}/decline`,{workerId:S.wid});await refresh();break;
   case 'finished':await api(`requests/${rid}/done`,{workerId:S.wid});await refresh();break;
   case 'withdraw':if(confirm(t('confWithdraw'))){await api(`requests/${rid}/withdraw`,{workerId:S.wid});await refresh()}break;
   case 'openChat':S.back=S.view;S.chat={rid,wid:w,role:el.dataset.role};S.cd='';S.view='chat';await refresh();break;
   case 'chatBack':S.view=S.back;S.chat=null;render();break;
   case 'sendMsg':await sendMsg(document.getElementById('cmsg').value,false);break;
   case 'quick':await sendMsg(QUICK[+el.dataset.i][S.lang],false);break;
   case 'micMsg':listen(async txt=>{S.listening=false;await sendMsg(txt,true)});break;
   case 'micYesNo':{
     const first=S.data.requests.filter(r=>{const x=r.alerts.find(a=>a.workerId===S.wid);return x&&x.status==='sent'}).sort((a,b)=>b.created-a.created)[0];
     if(first)speak(reqLine(first));
     setTimeout(()=>listen(async txt=>{S.listening=false;const s=txt.toLowerCase();
       const yes=/हाँ|हां|हा |ठीक|जी|yes|haan|ha |ok|theek/.test(s+' '),no=/ना|नहीं|नही|no|nahi/.test(s);
       if(first&&yes&&!no)await api(`requests/${first.id}/accept`,{workerId:S.wid});
       else if(first&&no)await api(`requests/${first.id}/decline`,{workerId:S.wid});
       await refresh()}),first?3500:0);break}
   case 'reset':if(confirm('Reset?')){await api('reset',{});S.rid=null;S.wid=null;await refresh()}break;
  }
});
document.addEventListener('input',e=>{const i=e.target.id;
  if(i==='typed')S.draft.heard=e.target.value;
  if(i==='pay'){S.draft.pay=+e.target.value||null;const p=document.getElementById('price');if(p)p.innerHTML=priceBox()}
  if(S.pay&&i==='upiid')S.pay.upi=e.target.value;
  if(S.pay&&i==='cno'){const v=e.target.value.replace(/\D/g,'').slice(0,19).replace(/(.{4})/g,'$1 ').trim();e.target.value=v;S.pay.card.no=v}
  if(S.pay&&i==='cexp'){let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v;S.pay.card.exp=v}
  if(S.pay&&i==='ccvv'){const v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v;S.pay.card.cvv=v}
  if(S.lg&&i==='lphone')S.lg.phone=e.target.value.replace(/\D/g,'');
  if(S.lg&&i==='lotp')S.lg.otp=e.target.value;
  if(S.lg&&i==='rname'){S.lg.name=e.target.value}
  if(S.lg&&i==='rupi')S.lg.upi=e.target.value;if(i==='cmsg')S.cd=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cmsg')sendMsg(e.target.value,false)});
setInterval(async()=>{if(!S.data||S.listening)return;if(['emp','wkLogin','pay'].includes(S.view))return;S.auto=true;try{S.data=await api('state');render()}catch(e){}S.auto=false},3000);
try{S.wid=localStorage.wid||null}catch(e){}
refresh();
</script>
</body>
</html>
